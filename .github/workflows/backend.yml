# The backend: tests on every push and pull request; on main, the otto-backend image
# (deploy/backend.Dockerfile) is built and pushed to GHCR, tagged with the commit and `main`.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "brain/**"
      - "gateway/**"
      - "orchestrator/**"
      - "runner/**"
      - "shared/**"
      - "scripts/access_requests.py"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "brain/**"
      - "gateway/**"
      - "orchestrator/**"
      - "runner/**"
      - "shared/**"
      - "scripts/access_requests.py"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the sandbox's handlers shell out to git and ripgrep (GitHub's runners have git)
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/taufik041/otto-backend:${{ github.sha }}
            ghcr.io/taufik041/otto-backend:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
