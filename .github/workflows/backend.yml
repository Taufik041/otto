# The backend: tests on every push and pull request; on every push to main, two images are built
# and pushed to GHCR, tagged with the commit and `main`: otto-backend (deploy/backend.Dockerfile)
# and otto-sandbox (infra/sandbox.Dockerfile, the runner the sandbox node pulls; a public
# package). Every commit on main has both, so deploy.sh can pin any of them (and roll back to it).
name: backend

on:
  # every push to main, whatever it changes: each commit gets its images, and the deploy that
  # follows pins them
  push:
    branches: [main]
  pull_request:
    paths:
      - "brain/**"
      - "gateway/**"
      - "orchestrator/**"
      - "runner/**"
      - "shared/**"
      - "scripts/access_requests.py"
      - "tests/**"
      - "deploy/**"
      - "infra/sandbox.Dockerfile"
      - "infra/entrypoint.sh"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  # never on main: a cancelled run would leave its commit without images
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the sandbox's handlers shell out to git and ripgrep (GitHub's runners have git)
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/taufik041/otto-backend:${{ github.sha }}
            ghcr.io/taufik041/otto-backend:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sandbox-image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/sandbox.Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/taufik041/otto-sandbox:${{ github.sha }}
            ghcr.io/taufik041/otto-sandbox:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
