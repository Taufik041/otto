[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otto"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aio-pika",
    "openai",
    "python-dotenv",
    "kubernetes",
    "pyjwt[crypto]",
    "requests",
    "sqlmodel",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "websockets",  # uvicorn needs a WebSocket library for the live event stream
    "alembic",
    "argon2-cffi",
    "python-multipart",  # the OAuth2 password form of POST /auth/token
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools]
packages = ["shared", "runner", "brain", "brain.prompts", "orchestrator", "gateway"]

[tool.setuptools.package-data]
shared = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
"brain.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["skeleton"]  # the first prototype, kept for reference
force-exclude = true  # pre-commit names files directly; skip skeleton/ then too

[tool.ruff.lint]
# the broad excepts are deliberate: a service logs and carries on (bus reconnects, background
# tasks, best-effort announcements) rather than dying on one bad call
ignore = ["BLE001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]
