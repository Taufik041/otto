# Otto's schema migrations. init_db() runs `upgrade head` itself; this file is for the CLI:
#   alembic upgrade head                 # DATABASE_URL, default postgresql+psycopg://otto:otto@localhost:5432/otto
#   alembic revision -m "what changed"   # then write upgrade()/downgrade() by hand
[alembic]
script_location = %(here)s/shared/migrations
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
