<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32.png" />
    <link rel="apple-touch-icon" href="/favicon-light-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFCFD" />
    <title>Otto</title>
    <script>
      // the theme (Light unless Dark or System was chosen) and its favicon, before first paint;
      // src/theme/theme.ts keeps them afterwards
      ;(function () {
        var c = null
        try { c = localStorage.getItem('otto.theme') } catch (e) {}
        var dark = c === 'dark' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var t = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        var set = function (sel, attr, v) { var el = document.head.querySelector(sel); if (el) el.setAttribute(attr, v) }
        set('link[rel="icon"][type="image/svg+xml"]', 'href', '/favicon-' + t + '.svg')
        set('link[rel="icon"][type="image/png"]', 'href', '/favicon-' + t + '-32.png')
        set('link[rel="apple-touch-icon"]', 'href', '/favicon-' + t + '-180.png')
        set('meta[name="theme-color"]', 'content', dark ? '#111318' : '#FBFCFD')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
