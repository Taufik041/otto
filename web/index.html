<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32.png" />
    <link rel="apple-touch-icon" href="/favicon-light-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFCFD" />
    <title>Otto</title>
    <script>
      // the theme and its favicon, before first paint, by src/theme/theme.ts's rule (which keeps
      // them afterwards): the user's choice, else System (the OS setting). The old key only
      // counts its "dark": its "light" may never have been picked
      ;(function () {
        var c = null
        try {
          c = localStorage.getItem('otto.theme.v2')
          if (c !== 'light' && c !== 'dark' && c !== 'system') c = localStorage.getItem('otto.theme') === 'dark' ? 'dark' : 'system'
        } catch (e) {}
        var os = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var dark = c === 'dark' || (c !== 'light' && os)
        var t = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        var set = function (sel, attr, v) { var el = document.head.querySelector(sel); if (el) el.setAttribute(attr, v) }
        set('link[rel="icon"][type="image/svg+xml"]', 'href', '/favicon-' + t + '.svg')
        set('link[rel="icon"][type="image/png"]', 'href', '/favicon-' + t + '-32.png')
        set('link[rel="apple-touch-icon"]', 'href', '/favicon-' + t + '-180.png')
        set('meta[name="theme-color"]', 'content', dark ? '#111318' : '#FBFCFD')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
