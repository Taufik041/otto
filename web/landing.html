<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32.png" />
    <link rel="apple-touch-icon" href="/favicon-light-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFCFD" />
    <title>Otto: describe the change, Otto opens the pull request</title>
    <meta name="description" content="An autonomous coding agent that works in its own cloud sandbox, runs your tests, and proposes a pull request you approve." />
    <script>
      // the system's light or dark, and its favicon, before first paint (src/landing/main.tsx keeps them)
      ;(function () {
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        var t = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        var set = function (sel, attr, v) { var el = document.head.querySelector(sel); if (el) el.setAttribute(attr, v) }
        set('link[rel="icon"][type="image/svg+xml"]', 'href', '/favicon-' + t + '.svg')
        set('link[rel="icon"][type="image/png"]', 'href', '/favicon-' + t + '-32.png')
        set('link[rel="apple-touch-icon"]', 'href', '/favicon-' + t + '-180.png')
        set('meta[name="theme-color"]', 'content', dark ? '#111318' : '#FBFCFD')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
