# RabbitMQ on a 2 GB server (mounted as conf.d/90-otto.conf). Otto's queues are small: job ids
# and one session's actions and results.
# block publishers well before the container's 320 MiB limit
vm_memory_high_watermark.absolute = 200MiB
disk_free_limit.absolute = 1GB
# AMQP only: no management UI, no guest login from anywhere
loopback_users.guest = true
log.console.level = warning
